name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Verify and stage static observatory bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run pre-deploy verification gate
        run: python -B src/verify_site.py

      - name: Stage static site bundle
        run: |
          set -euo pipefail
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -d assets
          test -d data
          test -d vendor
          test -d schemas
          rm -rf _site
          mkdir -p _site/data
          cp index.html manifest.webmanifest sw.js _site/
          cp -r assets vendor schemas _site/
          cp data/*.json _site/data/
          for gj in data/*.geojson; do
            if [ -e "$gj" ]; then
              cp "$gj" _site/data/
            fi
          done
          for xf in data/*.xml; do
            if [ -e "$xf" ]; then
              cp "$xf" _site/data/
            fi
          done
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy static observatory to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
