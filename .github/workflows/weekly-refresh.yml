name: Weekly 7-Day Multi-Hazard Refresh & Deploy

on:
  schedule:
    # Runs every 7 days on Monday at 03:15 UTC (09:00 Nepal Standard Time)
    - cron: "15 3 * * 1"
  workflow_dispatch:
    inputs:
      refresh_osm:
        description: "Force fresh OpenStreetMap Overpass query (exposure & admin)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh open-access datasets & verify (7-day cycle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: weekly-refresh
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 20

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache upstream spatial & calibration inputs
        uses: actions/cache@v6
        with:
          path: |
            raw
            lit
            cache/overpass
          key: traya-inputs-v3-${{ runner.os }}

      - name: Run 7-day multi-hazard refresh (Python 3.12 stdlib)
        env:
          REFRESH_OSM: ${{ inputs.refresh_osm }}
        run: |
          set -euo pipefail
          if [ "${REFRESH_OSM:-false}" = "true" ]; then
            python -B src/refresh_weekly.py --refresh-osm
          else
            python -B src/refresh_weekly.py
          fi

      - name: Run pure-stdlib unit tests
        run: python -B src/test_pipeline.py --unit-only

      - name: Run site verification gate
        run: python -B src/verify_site.py

      - name: Commit refreshed data products
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # data/ covers refreshed .json, .geojson, and .xml outputs
          CANDIDATE_PATHS=(
            data/
            cache/usgs_catalogue.json
            cache/gem_faults.json
            cache/glofas_climatology.json
            cache/glofas_weekly.json
            cache/hydromet_weekly.json
            cache/gdacs_alerts.json
            cache/landslides.json
            cache/stac_scenes.json
            cache/nepal_admin.json
            cache/bipad_snapshot.json
            cache/eo_sar.json
            cache/tsho_rolpa_dem_90m.json
            index.html
            src/template.html
          )
          for f in "${CANDIDATE_PATHS[@]}"; do
            if [ -e "$f" ]; then
              git add -f -- "$f"
            fi
          done

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): automated 7-day multi-hazard & satellite refresh [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Stage static site bundle
        run: |
          set -euo pipefail
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -d assets
          test -d data
          test -d vendor
          test -d schemas
          rm -rf _site
          mkdir -p _site/data
          cp index.html manifest.webmanifest sw.js _site/
          cp -r assets vendor schemas _site/
          cp data/*.json _site/data/
          for gj in data/*.geojson; do
            if [ -e "$gj" ]; then
              cp "$gj" _site/data/
            fi
          done
          for xf in data/*.xml; do
            if [ -e "$xf" ]; then
              cp "$xf" _site/data/
            fi
          done
          touch _site/.nojekyll

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish refreshed observatory to GitHub Pages
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
